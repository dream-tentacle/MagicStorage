<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>魔法存储 — 存储接收器</title>
  <desc>Original 1×1 open intake tray. Broad clear receiving surface, low side rails and a compact rear controller. Pearl-grey housing with RGB(197,229,245) accents. Only the outside silhouette has a uniform pure-black contour.</desc>
  <!-- Shallow platform and foreground face. -->
  <rect x="26" y="72" width="460" height="414" rx="28" fill="#798893"/>
  <path d="M29 449Q29 480 58 482H455Q482 480 482 449" fill="none" stroke="#52616c" stroke-width="6"/>
  <rect x="26" y="42" width="460" height="416" rx="28" fill="#d8dfe3"/>
  <path d="M26 430Q26 458 54 458H458Q486 458 486 430" fill="none" stroke="#25313c" stroke-width="4"/>
  <path d="M40 200V76Q40 56 61 56H450Q468 56 472 72" fill="none" stroke="#f2f5f6" stroke-width="3" stroke-linecap="round"/>
  <path d="M473 85V418Q473 444 446 444H63" fill="none" stroke="#a8b6bf" stroke-width="4" stroke-linecap="round"/>

  <!-- Rear controller is quiet and stays clear of the item landing surface. -->
  <rect x="171" y="64" width="170" height="32" rx="5" fill="#aebdc6"/>
  <rect x="175" y="68" width="162" height="24" rx="3" fill="#344a5b"/>
  <path d="M188 77H212M188 84H205" stroke="#a6c0d0" stroke-width="2"/>
  <rect x="227" y="76" width="25" height="8" fill="#c5e5f5"/>
  <rect x="260" y="76" width="25" height="8" fill="#94b3c7"/>
  <path d="M302 80H323" stroke="#c5e5f5" stroke-width="2"/>

  <!-- A shallow, open receiving bed rather than a sealed door. -->
  <path d="M101 127H411L431 150V386L413 413H99L81 386V150Z" fill="#9eb2c0"/>
  <path d="M107 137H405L416 154V380L403 397H109L96 380V154Z" fill="#7993a5"/>
  <path d="M108 140H404L412 154H100Z" fill="#516d82"/>
  <path d="M100 155H108V371L117 391H109L100 380Z" fill="#8aa7ba"/>
  <path d="M409 155H415V380L403 393H395L409 372Z" fill="#668497"/>
  <path d="M110 380H403L393 394H120Z" fill="#a6bdcb"/>
  <!-- Two simple inlays guide items towards the open bed. -->
  <rect x="67" y="174" width="10" height="172" rx="2" fill="#c5e5f5"/>
  <rect x="435" y="174" width="10" height="172" rx="2" fill="#c5e5f5"/>
  <path d="M139 359V374H199M313 374H373V359" fill="none" stroke="#c5e5f5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M117 159H139M373 159H395" stroke="#a7bfce" stroke-width="2"/>

  <!-- Foreground intake lip; the receiving surface remains visually empty. -->
  <rect x="161" y="414" width="190" height="13" rx="3" fill="#bdccd5"/>
  <path d="M169 418H343" stroke="#e9f1f5" stroke-width="2"/>
  <path d="M178 425H334" stroke="#8ba3b4" stroke-width="2"/>
  <rect x="204" y="468" width="105" height="7" rx="3.5" fill="#344756"/>
  <path d="M217 471H243M277 471H296" stroke="#c5e5f5" stroke-width="2" stroke-linecap="round"/>
  <path d="M54 42H458Q486 42 486 70V458Q486 486 458 486H54Q26 486 26 458V70Q26 42 54 42Z" fill="none" stroke="#000000" stroke-width="8"/>
</svg>
