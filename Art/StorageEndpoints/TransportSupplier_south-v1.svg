  <path d="M473 83V390Q473 414 450 414H62" fill="none" stroke="#a8b6bf" stroke-width="4" stroke-linecap="round"/>

  <!-- Rear controls and a restrained colour insert. -->
  <rect x="68" y="65" width="82" height="38" rx="3" fill="#c3ced5"/>
  <rect x="75" y="73" width="25" height="20" fill="#c5e5f5"/>
  <path d="M111 80H139M111 88H130" stroke="#a4b7c4" stroke-width="2"/>
  <rect x="278" y="66" width="158" height="33" rx="5" fill="#aebdc6"/>
  <rect x="282" y="70" width="150" height="25" rx="3" fill="#344a5b"/>
