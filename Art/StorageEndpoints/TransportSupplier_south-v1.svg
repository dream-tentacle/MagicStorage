<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>魔法存储 — 物资补给器，南向设计稿</title>
  <desc>Original 1×1 material supplier, south view. Closed material chamber and a projecting delivery mouth on the south edge indicate the output direction. Pearl-grey shell with RGB(197,229,245) accents and a uniform black outer contour.</desc>
