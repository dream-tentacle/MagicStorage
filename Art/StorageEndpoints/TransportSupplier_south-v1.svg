  <rect x="327" y="79" width="21" height="8" fill="#c5e5f5"/>
  <rect x="355" y="79" width="21" height="8" fill="#9fbacb"/>
  <path d="M393 84H418" stroke="#c5e5f5" stroke-width="2"/>
  <path d="M40 122H472" stroke="#bfccd4" stroke-width="1.5"/>

  <!-- A closed material chamber keeps this terminal distinct from the receiving tray. -->
  <rect x="72" y="144" width="368" height="184" rx="10" fill="#adbfca"/>
  <rect x="77" y="149" width="358" height="169" rx="7" fill="#e0e7eb" stroke="#bdcbd3" stroke-width="1.5"/>
  <path d="M88 152H424" stroke="#f1f5f7" stroke-width="2"/>
  <rect x="91" y="165" width="10" height="138" fill="#c5e5f5"/>
