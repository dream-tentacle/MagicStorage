<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>魔法存储 — 存储控制核心，第二十一稿</title>
  <desc>A consistent medium level of structural finish: emitter caps, recessed lights, beam faces, cooling lips and collar depth share a restrained material vocabulary. The node controller is retained with fewer tiny marks. The v18 orbit, its single tapered shadow, the chassis silhouette and swept lower-corner shading are unchanged. Review artwork only. The exterior black contour is 12 units wide, three times the former 4 units; all internal artwork is retained.</desc>
