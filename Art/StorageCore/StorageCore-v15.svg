  <title>魔法存储 — 存储控制核心，第十五稿</title>
  <desc>Rounded-square storage core. The original shallow v11 orbit and its offset illuminated face are restored, preserving the dark rear/underside. The rear and front curves share endpoints and tangent directions; a closed underlying band prevents gaps. The node controller and swept chassis corner shadow are retained from v14. Accent RGB(197,229,245).</desc>
