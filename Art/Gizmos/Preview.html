<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔法存储 · Gizmo 图标</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 24px; background: #171d26; color: #e7eef6; font-family: "Microsoft YaHei", sans-serif; }
  main { max-width: 880px; margin: auto; }
  h1 { margin: 0 0 8px; font-size: 26px; font-weight: 500; }
  p { margin: 0 0 28px; color: #aab8c9; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
  figure { margin: 0; padding: 24px 12px 20px; text-align: center; background: #26313f; border: 1px solid #3a485a; border-radius: 8px; }
  img { display: block; width: 96px; height: 96px; margin: 0 auto 20px; }
  figcaption { font-size: 14px; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: #63d5ed; }
  .small { display: flex; justify-content: center; gap: 14px; margin-top: 16px; }
  .small img { width: 32px; height: 32px; margin: 0; }
  .small img + img { width: 48px; height: 48px; }
</style>
<main>
  <h1>魔法存储 · Gizmo 图标</h1>
  <p>9 张透明背景 SVG · 下方同时展示 32 和 48 像素缩略效果 · 点击名称打开源图</p>
  <div class="grid">
    <figure><img src="TransferInventory.svg" alt="两个立方体与单向箭头"><figcaption><a href="TransferInventory.svg">转移库存</a></figcaption><div class="small"><img src="TransferInventory.svg" alt="32 像素"><img src="TransferInventory.svg" alt="48 像素"></div></figure>
    <figure><img src="CraftingList.svg" alt="清单与小锤"><figcaption><a href="CraftingList.svg">制作清单</a></figcaption><div class="small"><img src="CraftingList.svg" alt="32 像素"><img src="CraftingList.svg" alt="48 像素"></div></figure>
    <figure><img src="Inventory.svg" alt="箱子与放大镜"><figcaption><a href="Inventory.svg">查看物品</a></figcaption><div class="small"><img src="Inventory.svg" alt="32 像素"><img src="Inventory.svg" alt="48 像素"></div></figure>
    <figure><img src="ConfigureShelf.svg" alt="三格货架与滑杆"><figcaption><a href="ConfigureShelf.svg">配置补货</a></figcaption><div class="small"><img src="ConfigureShelf.svg" alt="32 像素"><img src="ConfigureShelf.svg" alt="48 像素"></div></figure>
    <figure><img src="Refuel.svg" alt="燃料液滴与箭头"><figcaption><a href="Refuel.svg">立即补料</a></figcaption><div class="small"><img src="Refuel.svg" alt="32 像素"><img src="Refuel.svg" alt="48 像素"></div></figure>
    <figure><img src="SwitchSupplyMode.svg" alt="两条循环箭头"><figcaption><a href="SwitchSupplyMode.svg">切换供给模式</a></figcaption><div class="small"><img src="SwitchSupplyMode.svg" alt="32 像素"><img src="SwitchSupplyMode.svg" alt="48 像素"></div></figure>
    <figure><img src="TransferItems.svg" alt="箱子与双向箭头"><figcaption><a href="TransferItems.svg">转移物品</a></figcaption><div class="small"><img src="TransferItems.svg" alt="32 像素"><img src="TransferItems.svg" alt="48 像素"></div></figure>
    <figure><img src="ConfigureSupply.svg" alt="三个方块与勾选"><figcaption><a href="ConfigureSupply.svg">指定供给物品</a></figcaption><div class="small"><img src="ConfigureSupply.svg" alt="32 像素"><img src="ConfigureSupply.svg" alt="48 像素"></div></figure>
    <figure><img src="SupplyNow.svg" alt="箱子与向外箭头"><figcaption><a href="SupplyNow.svg">立即供应物资</a></figcaption><div class="small"><img src="SupplyNow.svg" alt="32 像素"><img src="SupplyNow.svg" alt="48 像素"></div></figure>
  </div>
</main>
</html>
