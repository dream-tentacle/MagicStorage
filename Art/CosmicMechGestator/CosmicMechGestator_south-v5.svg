<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 768 512">
  <title>魔法存储 — 宇宙机械体培育器，3×2 南向第五稿</title>
  <desc>A compact south-facing 3×2 mech gestator. The lid, glass vessel and lower collar share a consistent 0.7 ellipse aspect ratio and a common axis. Side manifolds closely flank the main tank on a smaller integrated platform. A single vessel dominates the silhouette. Pearl-grey metal, muted blue glass, restrained RGB(197,229,245) markers, and a uniform black exterior contour.</desc>
  <defs>
    <radialGradient id="lid-metal" cx="34%" cy="23%" r="84%">
      <stop offset="0" stop-color="#e1e9ef"/>
      <stop offset=".52" stop-color="#bccbd6"/>
      <stop offset="1" stop-color="#94abba"/>
    </radialGradient>
    <linearGradient id="tank-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e7895" stop-opacity=".87"/>
      <stop offset=".14" stop-color="#bbdfee" stop-opacity=".66"/>
      <stop offset=".5" stop-color="#9fc5dc" stop-opacity=".4"/>
      <stop offset=".84" stop-color="#76a3bf" stop-opacity=".64"/>
      <stop offset="1" stop-color="#4a718d" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="culture-fluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cfE3" stop-opacity=".2"/>
      <stop offset="1" stop-color="#5d87a3" stop-opacity=".5"/>
    </linearGradient>
    <clipPath id="tank-body-clip">
      <path d="M262 154C262 107 506 107 506 154V302C506 349 451 387.4 384 387.4C317 387.4 262 349 262 302Z"/>
    </clipPath>
  </defs>

  <g id="gestator-base">
    <!-- Tightly grouped equipment, on a single low chassis. -->
    <rect x="64" y="120" width="640" height="354" rx="20" fill="#7e939f"/>
    <rect x="64" y="100" width="640" height="350" rx="20" fill="#cdd8df"/>
    <path d="M64 430Q64 450 84 450H684Q704 450 704 430" fill="none" stroke="#536d7f" stroke-width="3.5"/>
    <path d="M77 215V127Q77 113 92 113H247M521 113H677Q691 113 691 128" fill="none" stroke="#edf3f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M691 142V419Q691 436 674 436H96" fill="none" stroke="#a0b5c3" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M89 392H679" stroke="#acbfcd" stroke-width="2"/>

    <!-- Matched side blocks use the same plane and height. -->
    <path d="M104 170L116 154H240V375H104Z" fill="#adbfcc"/>
    <path d="M112 174L121 163H231V366H112Z" fill="#8fa6b7"/>
    <path d="M528 154H652L664 170V375H528Z" fill="#adbfcc"/>
    <path d="M537 163H647L656 174V366H537Z" fill="#8fa6b7"/>
    <path d="M129 174H222M547 174H638" stroke="#cbdbe6" stroke-width="2"/>
    <path d="M131 190V216M142 190V216M153 190V216M615 190V216M626 190V216M637 190V216" stroke="#d2e2ec" stroke-width="4"/>

    <!-- Two pairs of short feed connections attach directly to the central vessel. -->
    <path d="M205 237H234L271 220M205 320H235L271 336M563 237H534L497 220M563 320H533L497 336" fill="none" stroke="#6e8a9f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M205 232H234L271 215M205 315H235L271 331M563 232H534L497 215M563 315H533L497 331" fill="none" stroke="#cddde7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="189" y="221" width="27" height="24" rx="6" fill="#9fb7c8"/>
    <ellipse cx="202.5" cy="221" rx="13.5" ry="9.45" fill="#dce8f0"/>
    <rect x="189" y="304" width="27" height="24" rx="6" fill="#9fb7c8"/>
    <ellipse cx="202.5" cy="304" rx="13.5" ry="9.45" fill="#dce8f0"/>
    <rect x="552" y="221" width="27" height="24" rx="6" fill="#9fb7c8"/>
    <ellipse cx="565.5" cy="221" rx="13.5" ry="9.45" fill="#dce8f0"/>
    <rect x="552" y="304" width="27" height="24" rx="6" fill="#9fb7c8"/>
    <ellipse cx="565.5" cy="304" rx="13.5" ry="9.45" fill="#dce8f0"/>
    <rect x="129" y="341" width="9" height="15" rx="2" fill="#c5e5f5"/>
    <rect x="630" y="341" width="9" height="15" rx="2" fill="#c5e5f5"/>

    <!-- All circular tank parts use the same projection: ry = rx × 0.7. -->
    <path d="M244 302V315C244 369 307 413 384 413C461 413 524 369 524 315V302Z" fill="#8fa9bb"/>
    <ellipse cx="384" cy="302" rx="140" ry="98" fill="#c6d8e4"/>
    <ellipse cx="384" cy="302" rx="129" ry="90.3" fill="#88a5ba"/>
    <ellipse cx="384" cy="302" rx="122" ry="85.4" fill="#7395ae"/>
    <ellipse cx="384" cy="302" rx="83" ry="58.1" fill="#a9c4d7"/>
    <ellipse cx="384" cy="300" rx="57" ry="39.9" fill="#c2d8e6"/>
    <path d="M281 368C334 409 434 409 487 368" fill="none" stroke="#e2edf4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g id="cylinder-glass" clip-path="url(#tank-body-clip)">
    <path d="M262 154C262 107 506 107 506 154V302C506 349 451 387.4 384 387.4C317 387.4 262 349 262 302Z" fill="url(#tank-glass)" stroke="#698ca5" stroke-width="2.5"/>
    <path d="M267 267C267 218 501 218 501 267V302C501 347 448 383.9 384 383.9C320 383.9 267 347 267 302Z" fill="url(#culture-fluid)"/>
    <path d="M275 268C275 310 493 310 493 268" fill="none" stroke="#d6eaf5" stroke-opacity=".25" stroke-width="2"/>
    <path d="M283 238V300Q283 338 310 357" fill="none" stroke="#eaf7fd" stroke-opacity=".44" stroke-width="6" stroke-linecap="round"/>
    <path d="M487 240V300Q487 338 460 357" fill="none" stroke="#527a96" stroke-opacity=".46" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="gestator-top">
    <path d="M252 142V154C252 205 311 246 384 246C457 246 516 205 516 154V142Z" fill="#88a2b6"/>
    <ellipse cx="384" cy="142" rx="132" ry="92.4" fill="url(#lid-metal)"/>
    <path d="M269 125C290 84 337 58 374 57" fill="none" stroke="#eaf2f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M299 220C347 245 421 245 469 220" fill="none" stroke="#c5e5f5" stroke-width="4" stroke-linecap="round"/>
    <path d="M365 132H403M365 141H403" stroke="#94adbf" stroke-width="3" stroke-linecap="round"/>
    <path d="M374 151H394" stroke="#c5e5f5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="front-service">
    <!-- A common front apron integrates the console, access step and service hatch. -->
    <path d="M88 405H680V449H88Z" fill="#bacbd7"/>
    <path d="M94 409H674" stroke="#e9f1f6" stroke-width="2"/>
    <rect x="102" y="416" width="143" height="23" rx="4" fill="#93afc3"/>
    <rect x="106" y="419" width="135" height="16" rx="2" fill="#344e64"/>
    <path d="M118 427H143M155 427H177M207 427H230" stroke="#c5e5f5" stroke-width="2.5"/>
    <path d="M283 412H485V449H283Z" fill="#8ea9bd"/>
    <path d="M288 409H480V421H288ZM288 429H480V441H288Z" fill="#d3e1ea"/>
    <path d="M294 412H474M294 432H474" stroke="#eaf3f8" stroke-width="2"/>
    <path d="M288 423H480M288 443H480" stroke="#7c99ad" stroke-width="2.5"/>
    <rect x="538" y="416" width="126" height="23" rx="4" fill="#d2e0e9"/>
    <path d="M550 427H582M592 427H606" stroke="#9ab3c6" stroke-width="2.5"/>
    <rect x="636" y="424" width="17" height="7" rx="2" fill="#c5e5f5"/>
    <rect x="343" y="461" width="82" height="6" rx="3" fill="#344e64"/>
    <path d="M355 464H379M401 464H414" stroke="#c5e5f5" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <path d="M84 100H266.4A132 92.4 0 0 1 501.6 100H684Q704 100 704 120V454Q704 474 684 474H84Q64 474 64 454V120Q64 100 84 100Z" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
