<svg xmlns="http://www.w3.org/2000/svg" width="768" height="352" viewBox="0 0 768 352">
  <title>魔法存储 — 宇宙工作台，第五稿</title>
  <desc>North-facing 3×1 workbench with concealed supports and a centered shallow trapezoid recess. An open assembly mat, a small screw vise and two flush mechanical sliders define the worktop. No standing monitor, screen or monitor base. RGB(197,229,245) accents and uniform black exterior contour. Transparent review artwork.</desc>
