<svg xmlns="http://www.w3.org/2000/svg" width="768" height="352" viewBox="0 0 768 352">
  <title>魔法存储 — 宇宙工作台，第三稿</title>
  <desc>Independent north-facing 3×1 workshop table. A thin chamfered worktop rests on two separate pedestals, leaving open knee space beneath the centered shallow trapezoid recess. A small mechanical vise, an uncluttered assembly mat and a tilted pale-blue display define the function. Restrained sky-blue accents use RGB(197,229,245). Uniform black exterior contours, flat material shading, transparent review artwork.</desc>
  <defs>
    <path id="worktop-body" d="M80 68H688L704 84V236L690 250H452L430 228H338L316 250H78L64 236V84Z"/>
    <path id="worktop-surface" d="M80 68H688L704 84V220L690 234H452L430 212H338L316 234H78L64 220V84Z"/>
    <clipPath id="surface-clip"><use href="#worktop-surface"/></clipPath>
  </defs>

  <!-- Separate feet and the open gap establish a furniture silhouette. -->
  <g id="pedestals">
    <path d="M101 217H205V277L194 288H108L101 281Z" fill="#71818a"/>
    <path d="M101 217H184V277H101Z" fill="#9ca8ae"/>
    <path d="M184 217H205V277L194 288H184Z" fill="#536773"/>
    <path d="M108 280H192V288H108Z" fill="#485962"/>
    <path d="M118 258H171" stroke="#627782" stroke-width="3"/>
    <path d="M134 265H155" stroke="#425a69" stroke-width="4"/>

    <path d="M591 217H659V281L651 288H598L591 281Z" fill="#71818a"/>
    <path d="M591 217H638V280H591Z" fill="#9ca8ae"/>
    <path d="M638 217H659V281L651 288H638Z" fill="#536773"/>
    <path d="M598 280H651V288H598Z" fill="#485962"/>
    <path d="M101 217H205V277L194 288H108L101 281Z" fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    <path d="M591 217H659V281L651 288H598L591 281Z" fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- The top is a plate with clipped corners, not an enclosing rounded shell. -->
  <g id="tabletop">
    <use href="#worktop-body" fill="#7d8c93"/>
    <path d="M64 220L78 234H316L338 212H430L452 234H690L704 220V236L690 250H452L430 228H338L316 250H78L64 236Z" fill="#657982"/>
    <path d="M430 212L452 234V250L430 228Z" fill="#465d6b"/>
    <path d="M316 234L338 212V228L316 250Z" fill="#91a1a9"/>
    <use href="#worktop-surface" fill="#c9cece"/>
    <g clip-path="url(#surface-clip)">
      <path d="M80 68H688L704 84H64Z" fill="#e0e4e1"/>
      <path d="M64 84H73V218L84 228L78 234L64 220Z" fill="#dce1de"/>
      <path d="M695 84H704V220L690 234H452L430 212H338L316 234H78L84 226H312L334 204H434L456 226H686L695 217Z" fill="#aab6ba"/>
    </g>
    <path d="M64 220L78 234H316L338 212H430L452 234H690L704 220" fill="none" stroke="#657982" stroke-width="2.5"/>
    <path d="M570 238H657V244H570Z" fill="#c5e5f5"/>
    <use href="#worktop-body" fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- A removable mat leaves a broad empty area for arbitrary production. -->
  <g id="assembly-surface">
    <path d="M253 109H511L518 116V193H246V116Z" fill="#96a7af"/>
    <path d="M246 187H518V193H246Z" fill="#7a909b"/>
  </g>

  <!-- A real screw vise distinguishes the bench from a display panel. -->
  <g id="bench-vise">
    <path d="M112 172H197V188H112Z" fill="#718793"/>
    <path d="M119 166H188L197 172H112Z" fill="#aebbc1"/>
    <path d="M120 131H181V168H120Z" fill="#7c919d"/>
    <path d="M121 139H181V157H121Z" fill="#536c7b"/>
    <path d="M119 124H181V137H119Z" fill="#b8c4c9"/>
    <path d="M119 133H181V139H119Z" fill="#4b6371"/>
    <path d="M119 157H181V170H119Z" fill="#b8c4c9"/>
    <path d="M119 165H181V171H119Z" fill="#7c919d"/>
    <path d="M177 148H216" stroke="#4f6877" stroke-width="7"/>
    <path d="M184 146H216" stroke="#aebdc5" stroke-width="3"/>
    <rect x="213" y="137" width="6" height="28" rx="2" fill="#607a89"/>
  </g>

  <!-- The display uses a separate angled stand and a light screen. -->
  <g id="terminal">
    <path d="M601 143H617V177H601Z" fill="#637d8c"/>
    <path d="M587 174H638L646 184H579Z" fill="#8b9fa9"/>
    <path d="M579 184H646V189H579Z" fill="#617b89"/>
    <path d="M575 95H651L643 153H567Z" fill="#718b9a"/>
    <path d="M575 95H651L648 101H574Z" fill="#b6c3c9"/>
    <path d="M581 104H641L635 139H575Z" fill="#c5e5f5"/>
    <path d="M583 112H615L614 117H582ZM581 124H629L628 129H580Z" fill="#7e9eb2"/>
    <path d="M567 146H644L643 153H567Z" fill="#4e6b7d"/>
  </g>
</svg>
