    <path d="M124 334Q124 358 148 358H620Q644 358 644 334" fill="none" stroke="#25313c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M134 264V160Q134 143 152 143H616Q631 143 633 158" fill="none" stroke="#f2f5f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M634 170V327Q634 348 614 348H151" fill="none" stroke="#a8b6bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
