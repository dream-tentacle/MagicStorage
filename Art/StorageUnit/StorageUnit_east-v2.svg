      <rect x="217" y="129" width="135" height="23" rx="4" fill="#344a5b" />
      <path d="M228 136H242M228 142H238" stroke="#9bbccb" stroke-width="1.8" stroke-linecap="round" />
      <rect x="252" y="135" width="16" height="7" rx="1" fill="#c5e5f5" />
