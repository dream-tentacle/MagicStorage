<svg xmlns="http://www.w3.org/2000/svg" width="768" height="512" viewBox="0 0 768 512">
  <title>魔法存储 — 存储单元，东向精简版</title>
  <desc>Original Magic Storage 1×2 storage unit. Two closed interchangeable cartridge lids, restrained RGB(197,229,245) sky-blue accents and a uniform pure-black exterior contour. Casing depth and highlights remain consistent between views.</desc>
