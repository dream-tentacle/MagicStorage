0" y="48" font-size="38" fill="#e3f5ff">作</text><text x="992.0" y="48" font-size="38" fill="#e3f5ff">台</text><polyline points="490,60 490,30 780.0,30" fill="none" stroke="#d5eaf5" stroke-width="5"/><polyline points="1070.0,30 1352,30 1352,60" fill="none" stroke="#d5eaf5" stroke-width="5"/><polyline points="490,338 490,370 1352,370 1352,338" fill="none" stroke="#d5eaf5" stroke-width="5"/><polyline points="490,75 490,325" fill="none" stroke="#7d929f" stroke-width="1"/><polyline points="1352,75 1352,325" fill="none" stroke="#7d929f" stroke-width="1"/><text x="831.0" y="84" font-size="13" fill="#a9cadc">C</text><text x="843.0" y="84" font-size="13" fill="#a9cadc">O</text><text x="856.3333333333334" y="84" font-size="13" fill="#a9cadc">S</text><text x="867.0" y="84" font-size="13" fill="#a9cadc">M</text><text x="881.6666666666666" y="84" font-size="13" fill="#a9cadc">I</text><text x="888.6666666666666" y="84" font-size="13" fill="#a9cadc">C</text><text x="900.6666666666666" y="84" font-size="13" fill="#a9cadc"> </text><text x="907.3333333333333" y="84" font-size="13" fill="#a9cadc">W</text><text x="923.3333333333333" y="84" font-size="13" fill="#a9cadc">O</text><text x="936.6666666666666" y="84" font-size="13" fill="#a9cadc">R</text><text x="948.6666666666666" y="84" font-size="13" fill="#a9cadc">K</text><text x="961.3333333333333" y="84" font-size="13" fill="#a9cadc">B</text><text x="972.9999999999999" y="84" font-size="13" fill="#a9cadc">E</text><text x="983.9999999999999" y="84" font-size="13" fill="#a9cadc">N</text><text x="996.9999999999999" y="84" font-size="13" fill="#a9cadc">C</text><text x="1008.9999999999999" y="84" font-size="13" fill="#a9cadc">H</text><text x="520" y="128" font-size="26" fill="#deedf5">将多种制作工作集中到一张工作台上。直接使用存储网络中的材料，</text><text x="520" y="166" font-size="26" fill="#deedf5">让殖民者专注于制作，无需往返取料。</text><circle cx="526" cy="205" r="4" fill="#f3ed83"/><text x="548" y="214" font-size="26" fill="#f3ed83">支持所有加工配方，包括mod配方。</text><circle cx="526" cy="249" r="4" fill="#f3ed83"/><text x="548" y="258" font-size="26" fill="#f3ed83">成品默认优先存回网络，也可设置为放在地上。</text><circle cx="526" cy="293" r="4" fill="#f3ed83"/><text x="548" y="302" font-size="26" fill="#f3ed83">可在设置开启“解锁工作台”模式，需要先消耗工作台材料才解锁配</text><text x="548" y="334" font-size="26" fill="#f3ed83">方。</text></g></svg>