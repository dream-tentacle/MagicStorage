" y="84" font-size="13" fill="#a9cadc">O</text><text x="952.8333333333333" y="84" font-size="13" fill="#a9cadc">R</text><text x="964.8333333333333" y="84" font-size="13" fill="#a9cadc">A</text><text x="977.1666666666666" y="84" font-size="13" fill="#a9cadc">G</text><text x="989.8333333333333" y="84" font-size="13" fill="#a9cadc">E</text><text x="520" y="128" font-size="23" fill="#deedf5">Combines multiple crafting jobs at one bench. Materials come directly </text><text x="520" y="157" font-size="23" fill="#deedf5">from the network, so workers do not need to fetch them.</text><circle cx="526" cy="193" r="4" fill="#f3ed83"/><text x="548" y="202" font-size="23" fill="#f3ed83">Supports all crafting recipes, including modded recipes.</text><circle cx="526" cy="231" r="4" fill="#f3ed83"/><text x="548" y="240" font-size="23" fill="#f3ed83">Products go into the network by default, or can be set to drop on the </text><text x="548" y="268" font-size="23" fill="#f3ed83">ground.</text><circle cx="526" cy="297" r="4" fill="#f3ed83"/><text x="548" y="306" font-size="23" fill="#f3ed83">Optional &quot;Unlock workbenches&quot; mode in settings: spend bench </text><text x="548" y="334" font-size="23" fill="#f3ed83">materials to unlock recipes.</text></g></svg>