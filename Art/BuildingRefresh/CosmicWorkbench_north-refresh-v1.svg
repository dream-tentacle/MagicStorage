  <title>魔法存储 — 宇宙工作台，第十五稿</title>
  <desc>North-facing 3×1 assembly workbench. The top-plate boundary, front bevel, front fascia and both notch faces use one shared set of junction vertices. No joint-fill patches or detached seam segments. Original exterior contour, vise, working plate, display and light blue-grey worktop color retained. Transparent draft, not installed.</desc>
